server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: children-park-membership
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/children_park?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: ChildrenParkHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
  
  redis:
    host: localhost
    port: 6379
    password: 
    database: 0
    timeout: 10000ms
    lettuce:
      pool:
        min-idle: 0
        max-idle: 8
        max-active: 8
        max-wait: -1ms
  
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.childrenpark.membership.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: ChildrenParkSecretKey2024
  expiration: 604800000
  header: Authorization
  prefix: Bearer

wechat:
  miniapp:
    app-id: your_wechat_appid
    app-secret: your_wechat_appsecret

qrcode:
  default-validity-minutes: 5

logging:
  level:
    com.childrenpark: debug
    org.springframework: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"

knife4j:
  enable: true
  setting:
    language: zh_cn
